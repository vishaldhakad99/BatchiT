name: BatchiT CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-test:
    name: Backend Tests & Integrity Check
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies (npm ci)
        working-directory: server
        run: npm ci

      - name: Validate backend JavaScript syntax
        working-directory: server
        run: node --check src/server.js

      - name: Run backend integration tests
        working-directory: server
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/batchit_test
        run: npm test

  frontend-build:
    name: Frontend Build & Asset Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies (npm ci)
        working-directory: client
        run: npm ci

      - name: Build production bundle (Vite)
        working-directory: client
        run: npm run build
