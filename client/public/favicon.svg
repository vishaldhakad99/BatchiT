<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="#11111B" stroke="#272738" stroke-width="2"/>
  <rect x="12" y="12" width="76" height="76" rx="20" fill="url(#bgGrad)" opacity="0.15"/>
  <!-- Modern Geometric B emblem with camera iris & lock accents -->
  <path d="M32 24 H56 C66 24 73 31 73 40 C73 46 69 51 63 53 C71 56 76 62 76 71 C76 81 68 88 56 88 H32 C28.7 88 26 85.3 26 82 V30 C26 26.7 28.7 24 32 24 Z" fill="none" stroke="url(#bgGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Upper inner loop -->
  <circle cx="51" cy="40" r="6" fill="#8B5CF6"/>
  <!-- Lower inner loop -->
  <circle cx="53" cy="70" r="8" fill="#EC4899"/>
  <!-- Central pulse flash dot -->
  <circle cx="36" cy="55" r="3.5" fill="#FFFFFF"/>
</svg>
